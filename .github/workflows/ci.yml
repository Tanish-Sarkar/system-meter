name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run test suite
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Install wheel and smoke-test installed CLI
        run: uv run --locked python scripts/smoke_installed_package.py --wheel-dir dist
