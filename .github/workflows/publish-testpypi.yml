name: Publish release candidate to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run test suite
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Read package version
        id: package-version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wheel and smoke-test installed CLI
        run: uv run --locked python scripts/smoke_installed_package.py --wheel-dir dist

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: system-meter-testpypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish approved artifacts to TestPyPI
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/system-meter
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: system-meter-testpypi-distributions
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Install and verify TestPyPI candidate
    needs: [build-and-validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install candidate from TestPyPI and smoke-test CLI
        run: >-
          uv run --no-project --python 3.13 python
          scripts/smoke_installed_package.py
          --testpypi-version "${{ needs.build-and-validate.outputs.version }}"
