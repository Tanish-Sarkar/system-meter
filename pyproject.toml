[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "system-meter"
version = "0.1.0"
description = "A fast, cross-platform system health snapshot for the command line."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psutil>=6.1",
    "rich>=13.9",
]

[project.scripts]
speakup = "speakup.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
